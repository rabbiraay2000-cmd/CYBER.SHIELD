<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Shield — Network Threat Detection</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#1e1b4b);color:#fff;min-height:100vh}
header{background:rgba(0,0,0,.35);padding:16px 32px;display:flex;align-items:center;gap:12px}
header .logo{font-size:28px}
header h1{font-size:20px}
header span{color:#93c5fd;font-size:13px}
main{max-width:720px;margin:32px auto;padding:0 16px}
.card{background:#fff;color:#0f172a;padding:24px;border-radius:16px;margin-bottom:20px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.card h3{margin-bottom:12px}
.stats{display:flex;gap:12px;margin-bottom:12px}
.stat{flex:1;background:#f1f5f9;border-radius:10px;padding:12px}
.stat b{font-size:22px;display:block}
.alert{background:#fee2e2;color:#991b1b;padding:10px;margin:8px 0;border-radius:8px;font-size:14px}
.ok{background:#dcfce7;color:#166534;padding:10px;margin:8px 0;border-radius:8px}
button{padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
.live{display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:50%;margin-right:6px;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.3}}
</style></head>
<body>
<header><div class="logo">🛡️</div>
<div><h1>Cyber Shield</h1><span><span class="live"></span>LIVE — Graph-based Network Threat Detection</span></div>
</header>
<main>
<div class="card"><h3>Network Graph</h3>
<div class="stats"><div class="stat"><b id="nodes">–</b>Nodes (IPs)</div>
<div class="stat"><b id="edges">–</b>Edges (Flows)</div></div>
<button onclick="load()">Refresh Now</button></div>
<div class="card"><h3>Threat Alerts</h3><div id="alerts">loading...</div></div>
</main>
<footer>Cyber Shield © 2026 — College Mini Project · IPs are nodes, flows are edges</footer>
<script>
async function load(){
  const s=await (await fetch('/api/status')).json();
  document.getElementById('nodes').innerText=s.nodes;
  document.getElementById('edges').innerText=s.edges;
  const a=await (await fetch('/api/alerts')).json();
  document.getElementById('alerts').innerHTML=a.length?
    a.map(x=>`<div class="alert">⚠️ [${x.type}] ${x.ip} — ${x.reason}</div>`).join(''):
    '<div class="ok">✅ Network clean — no threats detected</div>';
}
load(); setInterval(load,3000);
</script>
</body></html>
